[package]
name = "moq_directory_integrity"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "moq_directory_integrity"

[dependencies]
hdi = { workspace = true }
serde = { workspace = true }
holochain_serialized_bytes = "0.0.57"
# Explicit so `ActionHash` base64 parsing/printing (WP7 lobby references) never depends on
# feature unification with the coordinator. Same version hdi already resolves.
holo_hash = { version = "=0.7.0", features = ["encoding"] }
holochain-moq-protocol = { workspace = true }
holochain-moq-platform = { workspace = true }
