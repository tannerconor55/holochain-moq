[package]
name = "turbo_kart_integrity"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "turbo_kart_integrity"

[dependencies]
hdi = { workspace = true }
serde = { workspace = true }
holochain_serialized_bytes = "0.0.57"
holochain-moq-protocol = { workspace = true }
holochain-moq-turbo-kart = { workspace = true }
# Explicit so `ActionHash` base64 parsing/printing never depends on feature
# unification with the coordinator. Same version hdi already resolves.
holo_hash = { version = "=0.7.0", features = ["encoding"] }
