---
manifest_version: "0"
name: moq_directory
description: Control-plane peer/stream discovery for holochain-moq
roles:
  - name: moq_directory
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: ./moq_directory.dna
      modifiers:
        network_seed: ~
        properties: ~
      installed_hash: ~
      clone_limit: 0
