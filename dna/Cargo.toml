# Holochain DNA workspace (wasm32-unknown-unknown zomes). Deliberately a
# separate Cargo workspace from the native workspace at the repo root: zomes
# build for a different target with different flags. See PROTOCOL.md.
[workspace]
resolver = "2"
# Two DNAs (gaming platform split): `gaming_directory` (platform-wide records)
# and `turbo_kart` (Turbo Kart's lobbies and results). Each has a TEST-ONLY
# `forge` coordinator, packed only into its workdir/<dna>/forge test DNA.
members = [
    "gaming_directory/integrity",
    "gaming_directory/coordinator",
    "gaming_directory/forge",
    "turbo_kart/integrity",
    "turbo_kart/coordinator",
    "turbo_kart/forge",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hdi = "=0.8.0"
hdk = "=0.7.0"
serde = "1"
holochain-moq-protocol = { path = "../crates/protocol" }
holochain-moq-platform = { path = "../crates/platform" }
holochain-moq-turbo-kart = { path = "../crates/turbo-kart" }

[profile.release]
opt-level = "z"
lto = true
