[package]
name = "turbo-kart-desktop"
description = "WP10.2: Tauri 2 desktop shell for Turbo Kart Rally. WebView -> Tauri IPC -> kart-net -> Holochain (lobby control plane only)."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "turbo_kart_desktop"
path = "src/lib.rs"

[[bin]]
name = "turbo-kart-desktop"
path = "src/main.rs"

[features]
# `desktop` builds the Tauri shell (needs WebKitGTK & co. on Linux). Without
# it, the IPC core (`ipc`) still builds and tests: `--no-default-features`.
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
holochain-moq-kart-net = { path = "../../../crates/kart-net" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
tauri = { version = "=2.12.1", optional = true, features = [] }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true, features = [] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Dev tooling only (examples/dev_install.rs): install both hApps under one agent.
holochain_client = "=0.9.0"
holochain_types = "=0.7.0"

# Its own workspace: the root workspace must not need WebKitGTK to build.
[workspace]
