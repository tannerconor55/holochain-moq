[package]
name = "two-peer"
description = "Milestone: hello-stream. Two native Rust processes exchanging arbitrary ephemeral data over MoQ/QUIC directly, with no relay and no Holochain."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hello-publisher"
path = "src/bin/hello_publisher.rs"

[[bin]]
name = "hello-subscriber"
path = "src/bin/hello_subscriber.rs"

[dependencies]
holochain-moq-realtime = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
