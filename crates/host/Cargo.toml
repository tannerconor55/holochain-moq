[package]
name = "holochain-moq-host"
description = "Transport-neutral host authority for a race mesh: epochs, deterministic election, heartbeat failure detection, host-owned AI publication and migration. Knows no iroh, MoQ, TLS, Holochain or game payloads."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-mesh = { workspace = true }
# AgentPubKeyB64 only (plain data types; no HDK / conductor dependency).
holochain-moq-protocol = { workspace = true }
holochain-moq-clock = { path = "../clock" }
tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
holochain-moq-mesh-iroh = { workspace = true, features = ["test-utils"] }
iroh = { workspace = true, features = ["test-utils"] }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
