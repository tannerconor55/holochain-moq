[package]
name = "holochain-moq-hdk-bridge"
description = "HolochainPeerDirectory: a PeerDirectory backed by the moq_directory DNA over holochain_client::AppWebsocket. The only crate that knows about a conductor, an installed app id, a DNA hash or a zome name."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-protocol = { workspace = true }
holochain-moq-node = { workspace = true }

holochain_client = "=0.9.0"
holo_hash = "=0.7.0"
holochain_serialized_bytes = "0.0.57"

async-trait = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
tokio = { workspace = true }
# Test-only: a real Ed25519 keypair, to simulate the `sign_admission_proof` zome
# function's real signing behaviour (see `tests.rs`) without a conductor.
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
