[package]
name = "holochain-moq-av-sync"
description = "Bounded A/V synchronization on the playback boundary: audio is the reference, video presentation positions are corrected by a bounded, deterministic policy per media epoch. Pure timeline arithmetic - no clock, transport, reconnect, discovery or Holochain."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-media-timeline = { workspace = true }
holochain-moq-playback = { workspace = true }
