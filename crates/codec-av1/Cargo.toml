[package]
name = "holochain-moq-codec-av1"
description = "Synthetic-video AV1 source (rav1e, pure Rust) and test decoder (rav1d, pure Rust) producing MediaObjects for the live publication. Codec logic lives here, never in realtime/protocol/node/DNA."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-realtime = { workspace = true }
holochain-moq-video = { workspace = true }
# `threading` is rav1e's switch for real multi-core work: without it rav1e's rayon layer
# (`maybe-rayon`) is a sequential shim, so thread and tile settings cannot create parallelism.
rav1e = { version = "=0.8.1", default-features = false, features = ["threading"] }
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8"] }
# Stage 17F: SVT-AV1 is loaded at run time (dlopen), never linked. Already in Cargo.lock.
libloading = "0.8"
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
holochain-moq-protocol = { workspace = true }
url = { workspace = true }
