[package]
name = "holochain-moq-audio"
description = "The audio capture boundary: AudioFrame (interleaved 16-bit PCM), AudioFrameSource, AudioSourceError and a deterministic synthetic source. No codec, device, transport or Holochain dependency."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
