[package]
name = "holochain-moq-video-adapt"
description = "Adaptive video: a small deterministic policy that turns delivery-pressure and encoder-pressure observations into bounded video quality choices (frame-rate divisor, keyframe interval) applied to the AV1 encoder's runtime controls. No transport, discovery or Holochain logic."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-codec-av1 = { workspace = true }
holochain-moq-realtime = { workspace = true }

[dev-dependencies]
holochain-moq-video = { workspace = true }
tokio = { workspace = true }
