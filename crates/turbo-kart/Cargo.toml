[package]
name = "holochain-moq-turbo-kart"
description = "Turbo Kart's control-plane records and rules (lobbies, membership, race status, results, leaderboard), shared by the turbo_kart DNA and native clients. Game-specific: no platform or realtime crate may depend on it."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-protocol = { workspace = true }
serde = { workspace = true }
# Invite-code KDF / proofs (moved from crates/protocol with the lobby records).
sha2 = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }

[dev-dependencies]
serde_json = { workspace = true }
