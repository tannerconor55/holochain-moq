[package]
name = "holochain-moq-node"
description = "Application/orchestration layer: wires a PeerDirectory (durable control-plane discovery) to the MoQ realtime transport. Neither plane depends on the other - this crate is the only place allowed to depend on both. See ARCHITECTURE.md 'Host-side control-plane abstraction'."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-protocol = { workspace = true }
holochain-moq-realtime = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
