[package]
name = "holochain-moq-mic-alsa"
description = "The one real microphone backend: ALSA capture on Linux, via the `arecord` tool. Implements holochain_moq_audio::AudioFrameSource. Knows nothing about codecs, MoQ or Holochain."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-audio = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
