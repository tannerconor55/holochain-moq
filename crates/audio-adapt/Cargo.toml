[package]
name = "holochain-moq-audio-adapt"
description = "Adaptive audio: a small deterministic policy that turns delivery-pressure observations into bounded Opus bitrate choices, applied to the encoder's runtime control. No transport, discovery, video or Holochain logic."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-codec-opus = { workspace = true }
holochain-moq-realtime = { workspace = true }

[dev-dependencies]
holochain-moq-audio = { workspace = true }
