[package]
name = "holochain-moq-audio-transport"
description = "Audio over the live MoQ publication: AudioFrameSource -> Opus -> MediaObject -> MoqLivePublication, and the subscriber path back to AudioFrame. The one place that joins the audio codec to the realtime layer; no Holochain, no capture, no playback."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-audio = { workspace = true }
holochain-moq-codec-opus = { workspace = true }
holochain-moq-realtime = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
holochain-moq-protocol = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
