[package]
name = "holochain-moq-media-timeline"
description = "One shared media presentation timeline for audio and video: maps an audio frame's authoritative sample position and a video presentation timestamp onto the same microsecond timeline through explicit offsets. Pure arithmetic - no transport, capture, playback, codec or Holochain."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-audio = { workspace = true }
holochain-moq-video = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
