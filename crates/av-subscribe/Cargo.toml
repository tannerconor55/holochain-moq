[package]
name = "holochain-moq-av-subscribe"
description = "Subscriber-side A/V reception: two independent MoQ tracks, each decoded by its existing pipeline (video: RecoveringDecoder over AV1; audio: AudioReceiver over Opus). A thin composition; no synchronization, playback, Holochain or transport logic of its own."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-audio-transport = { workspace = true }
holochain-moq-codec-av1 = { workspace = true }
holochain-moq-codec-opus = { workspace = true }
holochain-moq-realtime = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
holochain-moq-audio = { workspace = true }
holochain-moq-av-session = { workspace = true }
holochain-moq-camera-v4l = { workspace = true }
holochain-moq-media-timeline = { workspace = true }
holochain-moq-mic-alsa = { workspace = true }
holochain-moq-protocol = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
