[package]
name = "holochain-moq-screen-linux"
description = "Linux screen capture and picture display backends, both via the `gst-launch-1.0` tool: ScreenSource implements holochain_moq_video::VideoFrameSource and LumaDisplaySink implements holochain_moq_playback::VideoSink. Knows nothing about codecs, MoQ or Holochain."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
holochain-moq-video = { workspace = true }
holochain-moq-playback = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
holochain-moq-media-timeline = { workspace = true }
